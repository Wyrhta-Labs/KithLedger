services:
  api:
    build: .
    ports:
      - "${API_PORT:-4002}:3000"
    environment:
      DATABASE_URL: postgres://kith:${POSTGRES_PASSWORD}@db:5432/kithledger
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      API_PORT: 3000
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kithledger
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/<major>/docker and
      # declares the volume at /var/lib/postgresql — mounting the old
      # .../data path silently stops persisting data. An existing pre-18
      # volume must be recreated (npm run docker:reset) or pg_upgrade'd.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kith -d kithledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
